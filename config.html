<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>配置</title>
  <style>
    body { width: 450px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    h2, h3 { color: #333; }
    .section { margin-bottom: 20px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; background: #f9f9f9; }
    .section h3 { margin: 0 0 15px 0; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    input, textarea { width: calc(100% - 18px); padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; font-size: 14px; }
    textarea { resize: vertical; }
    button { background: #1890ff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 8px; transition: background 0.3s; }
    button:hover { background: #1760cc; }
    .project-item { border: 1px solid #f0f0f0; padding: 15px; margin-bottom: 10px; border-radius: 6px; background: white; }
    .project-item input { margin-bottom: 5px; }
    .delete-btn { background: #ff4d4f; }
    .delete-btn:hover { background: #d9363e; }
    .secondary-btn { background: #6c757d; }
    .secondary-btn:hover { background: #5a6268; }
    .config-actions { display: flex; justify-content: space-between; margin-top: 20px; }
    label { display: block; font-weight: bold; margin: 10px 0 5px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h2>Boss直聘AI助手 - 配置</h2>

  <div class="section">
    <h3>API配置</h3>
    <input type="text" id="apiEndpoint" placeholder="API端点">
    <input type="text" id="apiModel" placeholder="模型名称">
    <input type="password" id="apiKey" placeholder="API密钥">
  </div>

  <div class="section">
    <h3>分析项目</h3>
    <div id="projectList"></div>
    <button id="addProject">添加项目</button>
  </div>

  <div class="config-actions">
    <div>
        <button id="importConfigBtn" class="secondary-btn">导入配置</button>
        <input type="file" id="importConfigFile" accept=".json" style="display: none;">
        <button id="exportConfigBtn" class="secondary-btn">导出配置</button>
    </div>
    <button id="saveConfig">保存配置</button>
  </div>

  <script src="config.js"></script>
</body>
</html>
